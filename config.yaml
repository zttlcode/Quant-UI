# Quant-UI Stock Strategy Visualization Platform Configuration
# ============================================================

# --- Data Paths ---
# Root directory for strategy signal data
signal_root_dir: "D:/github/RobotMeQ_Dataset/QuantData"

# Root directory for historical price data (live bars)
price_root_dir: "D:/github/RobotMeQ_Dataset/QuantData/live"

# Output directory for exported HTML reports
output_dir: "./output"

# --- Strategy Configuration ---
# List of strategies to display in the platform
# Each strategy name corresponds to a subdirectory under signal_root_dir
# with naming convention: trade_point_live_{strategy_name}
default_strategy_list:
  - tea_radical_nature
  - fuzzy_ma

# --- Market & Level Defaults ---
default_market: "A"
default_level: "d"

# --- Signal Display Options ---
# If true, only show effective signals (label 1=buy, 3=sell)
# If false, show all signals regardless of label
show_only_effective_signal: true

# --- Position Options ---
show_unclosed_position: true
hold_stop_atr_multiplier: 1.0

# --- Trading Cost Parameters ---
commission: 0.0
slippage: 0.0

# --- Indicator Parameters ---
macd_fast: 12
macd_slow: 26
macd_signal: 9
ma_periods: [5, 10, 20]
atr_period: 14

# --- Duplicate Signal Handling ---
# Strategy for handling duplicate signals on the same day:
#   "first"  - keep the first signal by time order
#   "last"   - keep the last signal by time order
#   "latest" - keep the signal with the latest timestamp
duplicate_signal_strategy: "first"

# --- Continuous Signal Handling ---
# For consecutive buy signals: "first" or "last"
consecutive_buy_handling: "first"
# For consecutive sell signals (unexpected): "ignore" or "warn"
consecutive_sell_handling: "ignore"

# --- Logging ---
log_level: "INFO"
log_file: "./output/app.log"

# --- Web App ---
app_title: "Quant-UI | Stock Strategy Visualization"
app_port: 8501
app_host: "localhost"
